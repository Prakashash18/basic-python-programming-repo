name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/interactive-teaching-platform-j2oe9d
      - main
  workflow_dispatch:

# Needed for the deploy-pages action to publish and mint its OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Derives base_path ("/<repo>" for a project site, "" for a user site or
      # custom domain) so nothing here hardcodes the repository name.
      # Derives base_path ("/<repo>" for a project site, "" for a user site or
      # custom domain) so nothing here hardcodes the repository name.
      #
      # This step fails until Pages is switched on once, by hand, under
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # `enablement: true` cannot do it for you: creating a Pages site needs
      # repo-admin rights, which the default GITHUB_TOKEN does not have.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build static export
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}
        run: npx next build

      # Belt and braces: without this, Jekyll drops every _next/* asset.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
